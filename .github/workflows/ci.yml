name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: harness
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      HARNESS_TEST_DATABASE_URL: postgres://harness:harness@localhost:5432/harness?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # hosts/httpapi embeds the built web UI; its tests read the built index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the web UI
        run: npm ci && npm run build
        working-directory: web
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # includes ./bench and ./longtest (make bench-offline) and the pgstore tests
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          HARNESS_HOST: harness.example.com
          HARNESS_SECRET_KEY: ci
          OIDC_ISSUER: https://id.example.com
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
          OIDC_SESSION_KEY: ci
          LLM_BASE_URL: https://llm.example.com/v1
          LLM_API_KEY: ci
          LLM_MODELS: m
          LLM_DEFAULT_MODEL: m
          OPENSANDBOX_URL: http://opensandbox:8080
          OPENSANDBOX_API_KEY: ci
          OPENSANDBOX_IMAGE: example/sandbox:latest
