name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not use this form for a security problem**: see the security policy instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Paste the error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps or the smallest program that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the commit if you build from `main`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options: [harness (terminal), harness-web, harness-worker, embedded in my program, the web UI, other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Setup
      description: OS, sandbox backend, model provider, Postgres or not. Remove any key or token before pasting.
