# Production deployment on Dokploy (compose from the GitHub repository, auto deploy on push).
# Secrets and per-install values come from the Dokploy environment of the service, never from this file:
#
#   HARNESS_HOST            public host name, e.g. harness.tusko.ai
#   OIDC_ISSUER             e.g. https://id.tusko.ai
#   OIDC_CLIENT_ID / OIDC_CLIENT_SECRET
#   OIDC_SESSION_KEY        openssl rand -hex 32   (signs the login cookie)
#   HARNESS_SECRET_KEY      openssl rand -hex 32   (encrypts connector tokens)
#   GITHUB_LOGIN_CLIENT_ID / GITHUB_LOGIN_CLIENT_SECRET   (optional) "Continue with GitHub" on the sign-in page: a GitHub OAuth App
#                           (github.com > Settings > Developer settings > OAuth Apps) whose callback URL is
#                           https://${HARNESS_HOST}/auth/signin/github/callback. Accounts it creates wait for an admin's approval.
#   HARNESS_ADMINS          comma-separated logins or emails of the administrators: they see the admin panel (#/admin), approve
#                           new accounts and are emailed when someone signs up. Their own accounts are always approved.
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD / SMTP_FROM   (optional) the mail server for that notice (port 587 STARTTLS
#                           by default, 465 TLS); SMTP_FROM is the sender, e.g. "Harness <noreply@${HARNESS_HOST}>".
#   LLM_BASE_URL / LLM_API_KEY / LLM_MODELS / LLM_DEFAULT_MODEL
#   DAYTONA_API_KEY         the Daytona API key sandboxes are created with (https://app.daytona.io, Keys)
#   DAYTONA_API_URL / DAYTONA_TARGET / DAYTONA_SNAPSHOT   (optional) the API (default https://app.daytona.io/api), the
#                           region, and the snapshot sandboxes start from (default: the account's default snapshot; it must
#                           have bash, GNU coreutils, python3, git and ripgrep, see docs/sandbox-adapters.md section 3)
#   SANDBOX_IMAGES          (optional) profile=image, e.g. work=harness-office. This deployment runs AGENT_PROFILE=coding, which has no
#                           entry by default and so uses Daytona's default snapshot (or DAYTONA_SNAPSHOT).
#   LLM_DISCOVER_MODELS     (optional, default true) add the provider's model list to LLM_MODELS at startup; false: LLM_MODELS only
#   TELEGRAM_BOT_TOKEN / TELEGRAM_BOT_USERNAME   (optional; run one replica only: the bot long-polls)
#   SLACK_BOT_TOKEN / SLACK_SIGNING_SECRET   (optional; run one replica only) the Slack app's bot token (xoxb-) and signing
#                           secret. Request URLs: https://${HARNESS_HOST}/api/slack/events and /api/slack/interactive.
#   FACTORY / FACTORY_*     (optional) the agent factory: tasks from GitHub webhooks and cron, pull requests gated by CI and an
#                           independent reviewer model. See docs/factory.md; check the setup with `harness-web -factory-check`.
#   GITHUB_APP_ID / GITHUB_APP_SLUG / GITHUB_APP_CLIENT_ID / GITHUB_APP_CLIENT_SECRET / GITHUB_APP_PRIVATE_KEY
#                           (optional GitHub App: private repositories and project import. The PEM goes on one
#                           line in double quotes with \n for the line breaks.)
#   ARTIFACTS_S3_ENDPOINT / ARTIFACTS_S3_BUCKET / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   (optional) an S3-compatible store
#                           (RustFS on this Dokploy, e.g. http://rustfs:9000 on dokploy-network) for artifacts and for the files of
#                           projects that have no repository. Create the bucket first, or set ARTIFACTS_S3_CREATE_BUCKET=true.
#                           Without it these live in the database/file store. See docs/team.md, "Projects, templates and preview".
#   SENTRY_DSN              (optional) error tracking: every slog.Error of the process is reported to any Sentry-protocol
#                           tracker (Rustrak, Sentry, GlitchTip). Unset: logs only.
#   SENTRY_BROWSER_DSN      (optional) errors raised in the browser UI, in a Sentry project of their own.
#   UMAMI_URL / UMAMI_WEBSITE_ID   (optional) usage statistics with Umami; both or neither. The CSP allows only these.
#
# Sessions and the team data live on the harness-data volume (file store). Agents run in Daytona sandboxes, not in this
# container, so it needs outbound HTTPS to the Daytona API and the model router must be reachable on dokploy-network.
# (To go back to a self-hosted OpenSandbox server, see git history: SANDBOX_BACKEND=opensandbox with OPENSANDBOX_*.)
services:
  harness-web:
    build: .
    command: ["-team", "-addr", "0.0.0.0:8080"]
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      HARNESS_PRODUCTION: "1"
      HARNESS_PUBLIC_URL: https://${HARNESS_HOST}
      HARNESS_SECRET_KEY: ${HARNESS_SECRET_KEY}
      AGENT_PROFILE: coding

      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: https://${HARNESS_HOST}/auth/callback
      OIDC_SESSION_KEY: ${OIDC_SESSION_KEY}
      # 1: a new account from the identity provider waits for an admin's approval (set it when the provider allows registration)
      OIDC_REQUIRE_APPROVAL: ${OIDC_REQUIRE_APPROVAL:-}

      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID:-}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET:-}
      HARNESS_ADMINS: ${HARNESS_ADMINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      LLM_PROVIDER: openai
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODELS: ${LLM_MODELS}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL}
      # offer every model the provider's GET /models reports (not only LLM_MODELS) in the UI and allow runs on them
      LLM_DISCOVER_MODELS: ${LLM_DISCOVER_MODELS:-true}

      SANDBOX_BACKEND: daytona
      DAYTONA_API_KEY: ${DAYTONA_API_KEY}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-}
      SANDBOX_IMAGES: ${SANDBOX_IMAGES:-}
      # deny by default (required in production). Daytona tiers 3 and 4 enforce this list per sandbox; on tiers 1 and 2 the
      # account's own restricted policy applies instead (it already covers the hosts below) and the adapter logs a warning.
      # Set SANDBOX_EGRESS_ALLOWLIST in the Dokploy environment to add package mirrors, your API, ... (domains OR CIDRs).
      SANDBOX_EGRESS_ALLOWLIST: ${SANDBOX_EGRESS_ALLOWLIST:-github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,raw.githubusercontent.com,pypi.org,files.pythonhosted.org,registry.npmjs.org,proxy.golang.org,sum.golang.org,index.crates.io,static.crates.io,crates.io}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}

      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

      # The agent factory (docs/factory.md). Off unless FACTORY=1; with the GitHub App above it needs a webhook secret
      # and a reviewer model that is not the model that writes code. Run `harness-web -factory-check owner/name` first.
      FACTORY: ${FACTORY:-}
      FACTORY_WEBHOOK_SECRET: ${FACTORY_WEBHOOK_SECRET:-}
      FACTORY_REVIEW_MODEL: ${FACTORY_REVIEW_MODEL:-}
      FACTORY_NO_REVIEW: ${FACTORY_NO_REVIEW:-}
      FACTORY_REQUIRE_TESTS: ${FACTORY_REQUIRE_TESTS:-}
      FACTORY_PROTECTED: ${FACTORY_PROTECTED:-}
      FACTORY_POLICY: ${FACTORY_POLICY:-}
      FACTORY_MAX_CONCURRENT: ${FACTORY_MAX_CONCURRENT:-}
      FACTORY_MAX_ATTEMPTS: ${FACTORY_MAX_ATTEMPTS:-}
      FACTORY_DAILY_BUDGET_USD: ${FACTORY_DAILY_BUDGET_USD:-}
      FACTORY_DAILY_BUDGET_TOKENS: ${FACTORY_DAILY_BUDGET_TOKENS:-}
      FACTORY_DAILY_PER_PROJECT: ${FACTORY_DAILY_PER_PROJECT:-}
      FACTORY_LESSONS: ${FACTORY_LESSONS:-}
      FACTORY_RUN: ${FACTORY_RUN:-}
      MAX_SANDBOXES_PER_USER: ${MAX_SANDBOXES_PER_USER:-}

      ARTIFACTS_S3_ENDPOINT: ${ARTIFACTS_S3_ENDPOINT:-}
      ARTIFACTS_S3_BUCKET: ${ARTIFACTS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ARTIFACTS_S3_CREATE_BUCKET: ${ARTIFACTS_S3_CREATE_BUCKET:-}

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_BROWSER_DSN: ${SENTRY_BROWSER_DSN:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    volumes:
      - harness-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dokploy-network

volumes:
  harness-data:

networks:
  dokploy-network:
    external: true
