server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css image/svg+xml application/javascript application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Content-Security-Policy: written at container start by 40-telemetry.sh ('self' plus the configured origins)
    include /etc/nginx/csp.conf;

    # content-hashed files from the Astro build: never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        include /etc/nginx/csp.conf;
    }
    # pages and the runtime config keep their names: always revalidate
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        include /etc/nginx/csp.conf;
        try_files $uri $uri/ =404;
    }
    location = /healthz { access_log off; return 200 "ok\n"; }
}
